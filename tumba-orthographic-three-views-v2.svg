<svg xmlns="http://www.w3.org/2000/svg" width="2860" height="1850" viewBox="0 0 2860 1850">
  <title>Три уточнённых ортогональных вида тумбы</title>
  <desc>Фасад, вид сверху и вид слева, исправленные по исходному линейному рисунку. Общие пропорции соответствуют габариту 1800 на 600 на 800 миллиметров. Размерные обозначения отсутствуют.</desc>
  <defs>
    <style>
      .object {
        fill: none;
        stroke: #111;
        stroke-width: 2;
        stroke-linecap: square;
        stroke-linejoin: miter;
        vector-effect: non-scaling-stroke;
      }
      .label {
        fill: #111;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 28px;
        font-weight: 400;
        letter-spacing: 1.6px;
      }
    </style>
  </defs>

  <rect width="2860" height="1850" fill="#fff"/>

  <!-- ВИД СВЕРХУ. 1 SVG-единица = 1 мм. Передняя сторона внизу. -->
  <text class="label" x="140" y="125">ВИД СВЕРХУ</text>
  <g id="top-view" class="object" aria-label="Вид сверху">
    <!-- Общий габарит 1800 x 600 -->
    <rect x="140" y="170" width="1800" height="600"/>

    <!-- Непрерывный кант по периметру верхней плоскости -->
    <rect x="160" y="190" width="1760" height="560"/>

    <!-- Граница основной верхней плоскости и правого модуля -->
    <line x1="1440" y1="190" x2="1440" y2="750"/>

    <!-- Контуры утопленной ванночки в правой части -->
    <rect x="1470" y="200" width="440" height="540"/>
    <rect x="1490" y="220" width="400" height="500"/>

    <!-- Две задние направляющие и расположенная между ними световая планка -->
    <rect x="1490" y="245" width="400" height="10"/>
    <rect x="1500" y="259" width="380" height="8"/>
    <rect x="1490" y="270" width="400" height="10"/>
  </g>

  <!-- ФАСАД. 1 SVG-единица = 1 мм. -->
  <text class="label" x="140" y="875">ФАСАД</text>
  <g id="front-view" class="object" aria-label="Фасад">
    <!-- Наружный контур корпуса над цоколем: 1800 x 765 -->
    <rect x="140" y="920" width="1800" height="765"/>

    <!-- Левая боковина толщиной 20 мм -->
    <line x1="160" y1="920" x2="160" y2="1685"/>

    <!-- Внутренняя стойка основного модуля и шов полноразмерной правой двери -->
    <line x1="1420" y1="920" x2="1420" y2="1685"/>
    <line x1="1440" y1="920" x2="1440" y2="1685"/>

    <!-- Нижняя кромка верхней глухой панели -->
    <line x1="160" y1="1080" x2="1440" y2="1080"/>

    <!-- Узкий профиль и нижняя линия светового кармана над открытой нишей -->
    <line x1="170" y1="1092" x2="1410" y2="1092"/>
    <line x1="170" y1="1100" x2="1410" y2="1100"/>

    <!-- Тонкая полка открытой ниши -->
    <line x1="170" y1="1235" x2="1410" y2="1235"/>
    <line x1="170" y1="1245" x2="1410" y2="1245"/>

    <!-- Верхняя плоскость и передняя кромка дна ниши -->
    <line x1="160" y1="1375" x2="1420" y2="1375"/>
    <line x1="160" y1="1395" x2="1420" y2="1395"/>

    <!-- Единственный шов между двумя нижними фасадами -->
    <line x1="160" y1="1545" x2="1420" y2="1545"/>

    <!-- Правая дверь заподлицо: её контур образован внешним контуром и швом x=1300 -->

    <!-- Утопленный цоколь -->
    <rect x="200" y="1685" width="1680" height="35"/>
  </g>

  <!-- ВИД СЛЕВА. Глухая боковина без несуществующих фасадных швов. -->
  <text class="label" x="2100" y="875">ВИД СЛЕВА</text>
  <g id="left-view" class="object" aria-label="Вид слева">
    <!-- Боковина 600 x 765 над цоколем -->
    <rect x="2100" y="920" width="600" height="765"/>

    <!-- Утопленный цоколь: 50 мм от передней грани, 40 мм от задней -->
    <rect x="2150" y="1685" width="510" height="35"/>
  </g>
</svg>
