services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: carpdraw-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - carpdraw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: carpdraw-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - carpdraw
    depends_on:
      - app

  postgres:
    image: postgres:17-alpine
    container_name: carpdraw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-carpdraw}
      POSTGRES_USER: ${DB_USERNAME:-carpdraw}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - carpdraw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-carpdraw} -d ${DB_DATABASE:-carpdraw}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: carpdraw-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - carpdraw
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: carpdraw-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - carpdraw

  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: carpdraw-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - carpdraw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Timeout invariant: provider timeout (60) < job timeout (75) <
    # worker --timeout (80) < queue retry_after (database 90 / redis 360).
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=80 --max-time=3600

  stripe:
    image: stripe/stripe-cli:latest
    container_name: carpdraw-stripe
    restart: unless-stopped
    networks:
      - carpdraw
    depends_on:
      - nginx
    command: listen --api-key ${STRIPE_SECRET} --forward-to http://nginx/stripe/webhook

  node:
    image: node:22-alpine
    container_name: carpdraw-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    networks:
      - carpdraw
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/@vite/client || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  carpdraw:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
