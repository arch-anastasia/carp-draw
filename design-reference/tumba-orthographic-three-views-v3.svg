<svg xmlns="http://www.w3.org/2000/svg" width="2860" height="1850" viewBox="0 0 2860 1850">
  <title>Три ортогональных вида тумбы — уточнённый вид сверху</title>
  <desc>Фасад, вид сверху и вид слева. Верхняя правая зона исправлена по исходному фото: ниша расположена слева внутри правого модуля, продольная планка ориентирована по глубине. Габарит 1800 на 600 на 800 миллиметров; размерные обозначения отсутствуют.</desc>
  <defs>
    <style>
      .object {
        fill: none;
        stroke: #111;
        stroke-width: 2;
        stroke-linecap: square;
        stroke-linejoin: miter;
        vector-effect: non-scaling-stroke;
      }
      .label {
        fill: #111;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 28px;
        font-weight: 400;
        letter-spacing: 1.6px;
      }
    </style>
  </defs>

  <rect width="2860" height="1850" fill="#fff"/>

  <!-- ВИД СВЕРХУ. 1 SVG-единица = 1 мм. Передняя сторона внизу. -->
  <text class="label" x="140" y="125">ВИД СВЕРХУ</text>
  <g id="top-view" class="object" aria-label="Вид сверху">
    <!-- Общий габарит 1800 x 600 -->
    <rect x="140" y="170" width="1800" height="600"/>

    <!-- Непрерывный верхний кант -->
    <rect x="160" y="190" width="1760" height="560"/>

    <!-- Граница основного и правого модулей: 1300 + 500 -->
    <line x1="1440" y1="190" x2="1440" y2="750"/>

    <!-- Утопленная ниша в левой части правого модуля -->
    <rect x="1470" y="200" width="160" height="540"/>
    <rect x="1490" y="220" width="120" height="500"/>

    <!-- Продольная направляющая и световая планка, идущие по глубине -->
    <rect x="1610" y="220" width="10" height="500"/>
    <rect x="1628" y="230" width="8" height="480"/>

    <!-- Справа от планок остаётся сплошная верхняя плоскость -->
  </g>

  <!-- ФАСАД. 1 SVG-единица = 1 мм. -->
  <text class="label" x="140" y="875">ФАСАД</text>
  <g id="front-view" class="object" aria-label="Фасад">
    <rect x="140" y="920" width="1800" height="765"/>
    <line x1="160" y1="920" x2="160" y2="1685"/>
    <line x1="1420" y1="920" x2="1420" y2="1685"/>
    <line x1="1440" y1="920" x2="1440" y2="1685"/>
    <line x1="160" y1="1080" x2="1440" y2="1080"/>
    <line x1="170" y1="1092" x2="1410" y2="1092"/>
    <line x1="170" y1="1100" x2="1410" y2="1100"/>
    <line x1="170" y1="1235" x2="1410" y2="1235"/>
    <line x1="170" y1="1245" x2="1410" y2="1245"/>
    <line x1="160" y1="1375" x2="1420" y2="1375"/>
    <line x1="160" y1="1395" x2="1420" y2="1395"/>
    <line x1="160" y1="1545" x2="1420" y2="1545"/>
    <rect x="200" y="1685" width="1680" height="35"/>
  </g>

  <!-- ВИД СЛЕВА. -->
  <text class="label" x="2100" y="875">ВИД СЛЕВА</text>
  <g id="left-view" class="object" aria-label="Вид слева">
    <rect x="2100" y="920" width="600" height="765"/>
    <rect x="2150" y="1685" width="510" height="35"/>
  </g>
</svg>
