<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1850" viewBox="0 0 2000 1850">
  <title>Orthographic top and front views of the cabinet</title>
  <desc>Dimensioned orthographic drawing of a cabinet measuring 1800 millimetres wide, 800 millimetres high and 600 millimetres deep.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#087bc1"/>
    </marker>
    <style>
      .object { fill: none; stroke: #111; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; vector-effect: non-scaling-stroke; }
      .dimension { fill: none; stroke: #087bc1; stroke-width: 2; stroke-linecap: square; vector-effect: non-scaling-stroke; }
      .dimension-line { marker-start: url(#arrow); marker-end: url(#arrow); }
      .title { fill: #111; font-family: Arial, sans-serif; font-size: 34px; font-weight: 500; letter-spacing: 1px; }
      .subtitle { fill: #555; font-family: Arial, sans-serif; font-size: 24px; font-weight: 400; }
      .dim-text { fill: #087bc1; font-family: Arial, sans-serif; font-size: 32px; font-weight: 500; }
      .note { fill: #555; font-family: Arial, sans-serif; font-size: 23px; font-weight: 400; }
    </style>
  </defs>

  <rect x="0" y="0" width="2000" height="1850" fill="#fff"/>

  <!-- TOP VIEW: scale 0.85 px per mm; cabinet 1800 x 600 mm -->
  <text class="title" x="235" y="72">TOP VIEW / ВИД СВЕРХУ</text>
  <text class="subtitle" x="1765" y="72" text-anchor="end">1800 × 600 мм</text>

  <g id="top-view" aria-label="Top view">
    <!-- Overall top outline -->
    <rect class="object" x="235" y="160" width="1530" height="510"/>

    <!-- Continuous narrow top rim -->
    <rect class="object" x="252" y="177" width="1496" height="476"/>

    <!-- Main module / right module division: 1300 + 500 mm -->
    <line class="object" x1="1340" y1="160" x2="1340" y2="670"/>

    <!-- Recessed tray/cavity in the right 500 mm module -->
    <rect class="object" x="1366" y="186" width="374" height="459"/>
    <line class="object" x1="1366" y1="230" x2="1740" y2="230"/>
    <line class="object" x1="1366" y1="250" x2="1740" y2="250"/>

    <!-- Overall width dimension -->
    <line class="dimension" x1="235" y1="670" x2="235" y2="785"/>
    <line class="dimension" x1="1765" y1="670" x2="1765" y2="785"/>
    <line class="dimension dimension-line" x1="235" y1="755" x2="1765" y2="755"/>
    <rect x="916" y="730" width="168" height="50" fill="#fff"/>
    <text class="dim-text" x="1000" y="766" text-anchor="middle">1800 мм</text>

    <!-- Overall depth dimension -->
    <line class="dimension" x1="235" y1="160" x2="120" y2="160"/>
    <line class="dimension" x1="235" y1="670" x2="120" y2="670"/>
    <line class="dimension dimension-line" x1="150" y1="160" x2="150" y2="670"/>
    <rect x="121" y="347" width="58" height="136" fill="#fff"/>
    <text class="dim-text" x="150" y="415" text-anchor="middle" transform="rotate(-90 150 415)">600 мм</text>
  </g>

  <!-- FRONT VIEW: scale 0.85 px per mm; cabinet 1800 x 800 mm -->
  <text class="title" x="235" y="882">FRONT VIEW / ВИД СПЕРЕДИ</text>
  <text class="subtitle" x="1765" y="882" text-anchor="end">1800 × 800 мм</text>

  <g id="front-view" aria-label="Front view">
    <!-- Main carcass, 765 mm high above a 35 mm recessed plinth -->
    <rect class="object" x="235" y="940" width="1530" height="650.25"/>

    <!-- Right full-height door, nominal width 500 mm -->
    <line class="object" x1="1340" y1="940" x2="1340" y2="1590.25"/>

    <!-- Left front return and right frame around open/drawer module -->
    <line class="object" x1="252" y1="940" x2="252" y2="1590.25"/>
    <line class="object" x1="1323" y1="1076" x2="1323" y2="1343.75"/>

    <!-- Upper front panel: 160 mm high -->
    <line class="object" x1="252" y1="1076" x2="1340" y2="1076"/>

    <!-- Open central compartment: 315 mm high -->
    <line class="object" x1="252" y1="1343.75" x2="1340" y2="1343.75"/>

    <!-- Thin shelf centred in the open compartment -->
    <line class="object" x1="252" y1="1208" x2="1323" y2="1208"/>
    <line class="object" x1="252" y1="1216.5" x2="1323" y2="1216.5"/>

    <!-- Two lower drawer fronts: 150 mm and 140 mm high -->
    <line class="object" x1="252" y1="1471.25" x2="1340" y2="1471.25"/>

    <!-- Recessed plinth/toe-kick: 35 mm high, 60 mm inset at each end -->
    <rect class="object" x="286" y="1590.25" width="1428" height="29.75"/>

    <!-- Overall width dimension -->
    <line class="dimension" x1="235" y1="1620" x2="235" y2="1760"/>
    <line class="dimension" x1="1765" y1="1620" x2="1765" y2="1760"/>
    <line class="dimension dimension-line" x1="235" y1="1728" x2="1765" y2="1728"/>
    <rect x="916" y="1703" width="168" height="50" fill="#fff"/>
    <text class="dim-text" x="1000" y="1739" text-anchor="middle">1800 мм</text>

    <!-- Overall height dimension -->
    <line class="dimension" x1="235" y1="940" x2="120" y2="940"/>
    <line class="dimension" x1="286" y1="1620" x2="120" y2="1620"/>
    <line class="dimension dimension-line" x1="150" y1="940" x2="150" y2="1620"/>
    <rect x="121" y="1212" width="58" height="136" fill="#fff"/>
    <text class="dim-text" x="150" y="1280" text-anchor="middle" transform="rotate(-90 150 1280)">800 мм</text>
  </g>

  <text class="note" x="1000" y="1812" text-anchor="middle">Габаритные размеры: 1800 × 800 × 600 мм · проекции без перспективного искажения</text>
</svg>
