<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="960" viewBox="0 0 1960 960">
  <title>Ортографический фасад тумбы</title>
  <desc>Чистый линейный фасад без размеров и надписей. Габарит мебели 1800 на 800 миллиметров.</desc>
  <rect width="1960" height="960" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" vector-effect="non-scaling-stroke">
    <rect x="80" y="80" width="1800" height="765"/>
    <rect x="140" y="845" width="1680" height="35"/>
    <line x1="100" y1="80" x2="100" y2="845"/>
    <line x1="1210" y1="80" x2="1210" y2="845"/>
    <line x1="1230" y1="80" x2="1230" y2="845"/>
    <line x1="100" y1="240" x2="1230" y2="240"/>
    <line x1="110" y1="252" x2="1200" y2="252"/>
    <line x1="110" y1="260" x2="1200" y2="260"/>
    <line x1="110" y1="395" x2="1200" y2="395"/>
    <line x1="110" y1="405" x2="1200" y2="405"/>
    <line x1="100" y1="535" x2="1210" y2="535"/>
    <line x1="100" y1="555" x2="1210" y2="555"/>
    <line x1="100" y1="705" x2="1210" y2="705"/>
  </g>
</svg>
