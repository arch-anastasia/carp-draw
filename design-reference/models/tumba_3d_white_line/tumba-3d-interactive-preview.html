:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:

    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);

}

.form-range:disabled {

.btn:not(.btn-primary, .viz-tile):is(

.btn:focus-visible {

svg {

&lt;script type=&quot;module&quot;&gt;
  import * as THREE from &quot;three&quot;;
  import { OrbitControls } from &quot;three/addons/controls/OrbitControls.js&quot;;

  const root = document.getElementById(&quot;tumba-3d-preview&quot;);
  const canvas = root.querySelector(&quot;canvas&quot;);
  const stage = root.querySelector(&quot;.tumba-stage&quot;);
  const loading = root.querySelector(&quot;.tumba-loading&quot;);
  const viewSelect = root.querySelector(&quot;[data-view-select]&quot;);
  const rotateButton = root.querySelector(&quot;[data-auto-rotate]&quot;);
  const dimensionsToggle = root.querySelector(&quot;[data-dimensions-toggle]&quot;);
  const surfaceProbe = root.querySelector(&quot;.tumba-surface-probe&quot;);
  const lineProbe = root.querySelector(&quot;.tumba-line-probe&quot;);
  const sceneProbe = root.querySelector(&quot;.tumba-scene-probe&quot;);
  const dimensionProbe = root.querySelector(&quot;.tumba-dimension-probe&quot;);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(34, 1, 0.01, 100);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.minDistance = 1.8;
  controls.maxDistance = 8;
  controls.maxPolarAngle = Math.PI * 0.92;
  controls.target.set(0, 0.4, 0);

  const cabinet = new THREE.Group();
  cabinet.name = &quot;tumba-white-line-model&quot;;
  scene.add(cabinet);

  let surfaceMaterial;
  let lineMaterial;
  let dimensionGroup;
  let activeView = &quot;perspective&quot;;

  function resolvedColor(element) {
    return getComputedStyle(element).color;
  }

  function applyTheme() {
    const surfaceColor = new THREE.Color(resolvedColor(surfaceProbe));
    const lineColor = new THREE.Color(resolvedColor(lineProbe));
    const sceneColor = new THREE.Color(resolvedColor(sceneProbe));
    scene.background = sceneColor;
    if (surfaceMaterial) surfaceMaterial.color.copy(surfaceColor);
    if (lineMaterial) lineMaterial.color.copy(lineColor);
    if (dimensionGroup) rebuildDimensions();
  }

  applyTheme();
  surfaceMaterial = new THREE.MeshBasicMaterial({
    color: new THREE.Color(resolvedColor(surfaceProbe)),
    side: THREE.FrontSide,
    toneMapped: false
  });
  lineMaterial = new THREE.LineBasicMaterial({
    color: new THREE.Color(resolvedColor(lineProbe)),
    transparent: false
  });

  const hiddenOutlineParts = new Set([
    &quot;rear_panel&quot;,
    &quot;main_bottom_panel&quot;,
    &quot;right_bottom_panel&quot;,
    &quot;upper_drawer_box&quot;,
    &quot;lower_drawer_box&quot;
  ]);

  function addBox(name, x0, depth0, z0, x1, depth1, z1) {
    const sizeX = (x1 - x0) / 1000;
    const sizeY = (z1 - z0) / 1000;
    const sizeZ = (depth1 - depth0) / 1000;
    const geometry = new THREE.BoxGeometry(sizeX, sizeY, sizeZ);
    const mesh = new THREE.Mesh(geometry, surfaceMaterial);
    mesh.name = name;
    mesh.position.set(
      (x0 + x1) / 2000 - 0.9,
      (z0 + z1) / 2000,
      0.3 - (depth0 + depth1) / 2000
    );
    cabinet.add(mesh);

    if (!hiddenOutlineParts.has(name)) {
      const edges = new THREE.EdgesGeometry(geometry, 15);
      const lines = new THREE.LineSegments(edges, lineMaterial);
      lines.name = `${name}_linework`;
      lines.position.copy(mesh.position);
      lines.renderOrder = 2;
      cabinet.add(lines);
    }
  }

  addBox(&quot;plinth&quot;, 60, 50, 0, 1740, 560, 35);
  addBox(&quot;left_side_panel&quot;, 0, 0, 35, 20, 600, 800);
  addBox(&quot;right_side_panel&quot;, 1780, 0, 35, 1800, 600, 800);
  addBox(&quot;rear_panel&quot;, 20, 580, 35, 1780, 600, 780);
  addBox(&quot;module_divider&quot;, 1280, 20, 35, 1300, 580, 780);
  addBox(&quot;main_bottom_panel&quot;, 20, 20, 35, 1280, 580, 55);
  addBox(&quot;right_bottom_panel&quot;, 1300, 20, 35, 1780, 580, 55);
  addBox(&quot;upper_front_panel&quot;, 20, 0, 640, 1280, 20, 800);
  addBox(&quot;upper_drawer_front&quot;, 20, 0, 177, 1280, 20, 323);
  addBox(&quot;lower_drawer_front&quot;, 20, 0, 37, 1280, 20, 173);
  addBox(&quot;right_full_height_door&quot;, 1304, 0, 39, 1778, 20, 796);
  addBox(&quot;upper_drawer_box&quot;, 40, 22, 185, 1260, 550, 315);
  addBox(&quot;lower_drawer_box&quot;, 40, 22, 45, 1260, 550, 165);
  addBox(&quot;niche_ceiling&quot;, 20, 20, 620, 1280, 580, 640);
  addBox(&quot;niche_floor&quot;, 20, 20, 325, 1280, 580, 345);
  addBox(&quot;niche_back_lining&quot;, 20, 570, 325, 1280, 580, 640);
  addBox(&quot;niche_shelf&quot;, 30, 18, 475, 1270, 570, 485);
  addBox(&quot;niche_shelf_front_edge&quot;, 30, 12, 475, 1270, 22, 485);
  addBox(&quot;niche_upper_trim&quot;, 30, 12, 622, 1270, 24, 632);
  addBox(&quot;niche_light_strip&quot;, 40, 20, 624, 1260, 26, 629);
  addBox(&quot;top_front_rim&quot;, 0, 0, 780, 1800, 20, 800);
  addBox(&quot;top_back_rim&quot;, 0, 580, 780, 1800, 600, 800);
  addBox(&quot;top_left_rim&quot;, 0, 20, 780, 20, 580, 800);
  addBox(&quot;top_right_rim&quot;, 1780, 20, 780, 1800, 580, 800);
  addBox(&quot;main_top_surface&quot;, 20, 20, 780, 1300, 580, 798);
  addBox(&quot;cavity_left_rim&quot;, 1300, 20, 780, 1330, 580, 798);
  addBox(&quot;cavity_right_rim&quot;, 1770, 20, 780, 1780, 580, 798);
  addBox(&quot;cavity_front_rim&quot;, 1330, 20, 780, 1770, 30, 798);
  addBox(&quot;cavity_back_rim&quot;, 1330, 570, 780, 1770, 580, 798);
  addBox(&quot;cavity_floor&quot;, 1330, 30, 690, 1770, 570, 710);
  addBox(&quot;cavity_left_wall&quot;, 1330, 30, 710, 1350, 570, 780);
  addBox(&quot;cavity_right_wall&quot;, 1750, 30, 710, 1770, 570, 780);
  addBox(&quot;cavity_front_wall&quot;, 1350, 30, 710, 1750, 50, 780);
  addBox(&quot;cavity_back_wall&quot;, 1350, 550, 710, 1750, 570, 780);
  addBox(&quot;cavity_rear_rail&quot;, 1350, 515, 752, 1750, 525, 766);
  addBox(&quot;cavity_inner_rail&quot;, 1350, 490, 738, 1750, 500, 752);
  addBox(&quot;cavity_light_bar&quot;, 1360, 503, 754, 1740, 511, 762);

  function addDimensionLine(group, material, first, second) {
    const geometry = new THREE.BufferGeometry().setFromPoints([first, second]);
    const line = new THREE.Line(geometry, material);
    line.renderOrder = 10;
    group.add(line);
  }

  function addDimensionLineWithGaps(group, material, start, end, gapCenters, gapLength) {
    const direction = end.clone().sub(start);
    const totalLength = direction.length();
    direction.normalize();
    const intervals = gapCenters
      .map((center) =&gt; {
        const distance = center.clone().sub(start).dot(direction);
        return [
          Math.max(0, distance - gapLength / 2),
          Math.min(totalLength, distance + gapLength / 2)
        ];
      })
      .sort((first, second) =&gt; first[0] - second[0]);
    let cursor = 0;
    intervals.forEach(([gapStart, gapEnd]) =&gt; {
      if (gapStart &gt; cursor) {
        addDimensionLine(
          group,
          material,
          start.clone().addScaledVector(direction, cursor),
          start.clone().addScaledVector(direction, gapStart)
        );
      }
      cursor = Math.max(cursor, gapEnd);
    });
    if (cursor &lt; totalLength) {
      addDimensionLine(
        group,
        material,
        start.clone().addScaledVector(direction, cursor),
        end
      );
    }
  }

  function addDimensionTick(group, material, point, lineDirection) {
    const tickLength = 0.07;
    const perpendicular = Math.abs(lineDirection.y) &gt; 0.9
      ? new THREE.Vector3(1, 0, 0)
      : new THREE.Vector3(0, 1, 0);
    const tickDirection = lineDirection.clone().add(perpendicular).normalize();
    const halfTick = tickDirection.multiplyScalar(tickLength / 2);
    addDimensionLine(
      group,
      material,
      point.clone().sub(halfTick),
      point.clone().add(halfTick)
    );
  }

  function addDimensionLabel(group, text, position, color, scale = 0.42, rotation = 0) {
    const labelCanvas = document.createElement(&quot;canvas&quot;);
    labelCanvas.width = 320;
    labelCanvas.height = 80;
    const context = labelCanvas.getContext(&quot;2d&quot;);
    context.clearRect(0, 0, labelCanvas.width, labelCanvas.height);
    context.font = &quot;500 32px sans-serif&quot;;
    context.textAlign = &quot;center&quot;;
    context.textBaseline = &quot;middle&quot;;
    context.fillStyle = color;
    context.fillText(text, labelCanvas.width / 2, labelCanvas.height / 2);
    const texture = new THREE.CanvasTexture(labelCanvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.needsUpdate = true;
    const material = new THREE.SpriteMaterial({
      map: texture,
      transparent: true,
      depthTest: false,
      depthWrite: false,
      toneMapped: false,
      rotation
    });
    const label = new THREE.Sprite(material);
    label.position.copy(position);
    label.scale.set(scale, scale / 4, 1);
    label.renderOrder = 12;
    group.add(label);
  }

  function addOverallDimension(group, lineMaterial, start, end, extensionPairs, label, labelPosition, color, labelRotation = 0) {
    addDimensionLine(group, lineMaterial, start, end);
    extensionPairs.forEach(([first, second]) =&gt; addDimensionLine(group, lineMaterial, first, second));
    const direction = end.clone().sub(start).normalize();
    addDimensionTick(group, lineMaterial, start, direction);
    addDimensionTick(group, lineMaterial, end, direction);
    addDimensionLabel(group, label, labelPosition, color, 0.3, labelRotation);
  }

  function addChainDimension(group, material, points, extensionOrigins, labels, labelPositions, color, labelRotation = 0) {
    const direction = points.at(-1).clone().sub(points[0]).normalize();
    addDimensionLine(group, material, points[0], points.at(-1));
    points.forEach((point) =&gt; addDimensionTick(group, material, point, direction));
    extensionOrigins.forEach((origin, index) =&gt; {
      const overrun = points[index].clone().sub(origin).normalize().multiplyScalar(0.025);
      addDimensionLine(group, material, origin, points[index].clone().add(overrun));
    });
    labels.forEach((label, index) =&gt; {
      addDimensionLabel(group, label, labelPositions[index], color, 0.3, labelRotation);
    });
  }

  function updateDimensionVisibility() {
    dimensionGroup.visible = dimensionsToggle.checked;
    const frontDetails = dimensionGroup.getObjectByName(&quot;front-detail-dimensions&quot;);
    const depthDimension = dimensionGroup.getObjectByName(&quot;depth-dimension&quot;);
    if (frontDetails) frontDetails.visible = activeView === &quot;front&quot;;
    if (depthDimension) depthDimension.visible = activeView !== &quot;front&quot;;
  }

  function rebuildDimensions() {
    dimensionGroup.traverse((child) =&gt; {
      if (child.geometry) child.geometry.dispose();
      if (child.material?.map) child.material.map.dispose();
      if (child.material) child.material.dispose();
    });
    dimensionGroup.clear();
    const color = resolvedColor(dimensionProbe);
    const lineMaterial = new THREE.LineBasicMaterial({
      color: new THREE.Color(color),
      depthTest: false,
      depthWrite: false,
      transparent: false
    });
    addOverallDimension(
      dimensionGroup,
      lineMaterial,
      new THREE.Vector3(-0.9, -0.19, 0.31),
      new THREE.Vector3(0.9, -0.19, 0.31),
      [
        [new THREE.Vector3(-0.9, -0.015, 0.31), new THREE.Vector3(-0.9, -0.215, 0.31)],
        [new THREE.Vector3(0.9, -0.015, 0.31), new THREE.Vector3(0.9, -0.215, 0.31)]
      ],
      &quot;1800&quot;,
      new THREE.Vector3(0, -0.155, 0.31),
      color
    );

    addOverallDimension(
      dimensionGroup,
      lineMaterial,
      new THREE.Vector3(-1.1, 0, 0.31),
      new THREE.Vector3(-1.1, 0.8, 0.31),
      [
        [new THREE.Vector3(-0.915, 0, 0.31), new THREE.Vector3(-1.125, 0, 0.31)],
        [new THREE.Vector3(-0.915, 0.8, 0.31), new THREE.Vector3(-1.125, 0.8, 0.31)]
      ],
      &quot;800&quot;,
      new THREE.Vector3(-1.145, 0.4, 0.31),
      color,
      Math.PI / 2
    );

    const depthDimension = new THREE.Group();
    depthDimension.name = &quot;depth-dimension&quot;;
    dimensionGroup.add(depthDimension);
    addOverallDimension(
      depthDimension,
      lineMaterial,
      new THREE.Vector3(1.06, 0.8, 0.3),
      new THREE.Vector3(1.06, 0.8, -0.3),
      [
        [new THREE.Vector3(0.9, 0.8, 0.3), new THREE.Vector3(1.06, 0.8, 0.3)],
        [new THREE.Vector3(0.9, 0.8, -0.3), new THREE.Vector3(1.06, 0.8, -0.3)]
      ],
      &quot;600&quot;,
