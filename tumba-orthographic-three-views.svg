<svg xmlns="http://www.w3.org/2000/svg" width="2860" height="1850" viewBox="0 0 2860 1850">
  <title>Три ортогональных вида тумбы</title>
  <desc>Фасад, вид сверху и вид слева. Общий габарит модели 1800 на 600 на 800 миллиметров. Размерные линии и числовые обозначения отсутствуют.</desc>
  <defs>
    <style>
      .object {
        fill: none;
        stroke: #111;
        stroke-width: 2;
        stroke-linecap: square;
        stroke-linejoin: miter;
        vector-effect: non-scaling-stroke;
      }
      .label {
        fill: #111;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 28px;
        font-weight: 400;
        letter-spacing: 1.6px;
      }
    </style>
  </defs>

  <rect width="2860" height="1850" fill="#fff"/>

  <!-- ВИД СВЕРХУ. Единый масштаб: 1 SVG-единица = 1 мм. -->
  <text class="label" x="140" y="125">ВИД СВЕРХУ</text>
  <g id="top-view" class="object" aria-label="Вид сверху">
    <!-- Общий контур 1800 x 600 -->
    <rect x="140" y="170" width="1800" height="600"/>

    <!-- Наружный верхний кант и внутренняя кромка -->
    <rect x="160" y="190" width="1760" height="560"/>

    <!-- Основная верхняя плоскость левого модуля -->
    <rect x="160" y="190" width="1280" height="560"/>

    <!-- Граница модулей 1300 + 500 -->
    <line x1="1440" y1="170" x2="1440" y2="770"/>

    <!-- Верхняя утопленная ванночка правого модуля -->
    <rect x="1470" y="200" width="440" height="540"/>
    <rect x="1490" y="220" width="400" height="500"/>

    <!-- Задние направляющие и световая планка ванночки -->
    <rect x="1490" y="245" width="400" height="10"/>
    <rect x="1490" y="270" width="400" height="10"/>
    <rect x="1500" y="259" width="380" height="8"/>
  </g>

  <!-- ФАСАД. Единый масштаб: 1 SVG-единица = 1 мм. -->
  <text class="label" x="140" y="875">ФАСАД</text>
  <g id="front-view" class="object" aria-label="Фасад">
    <!-- Корпус над цоколем: 1800 x 765 -->
    <rect x="140" y="920" width="1800" height="765"/>

    <!-- Левая боковина -->
    <line x1="160" y1="920" x2="160" y2="1685"/>

    <!-- Верхняя глухая панель основного модуля -->
    <rect x="160" y="920" width="1260" height="160"/>

    <!-- Правая стенка/разделитель основного модуля -->
    <line x1="1420" y1="920" x2="1420" y2="1685"/>
    <line x1="1440" y1="920" x2="1440" y2="1685"/>

    <!-- Верхняя кромка и световая планка открытой ниши -->
    <line x1="170" y1="1088" x2="1410" y2="1088"/>
    <line x1="170" y1="1098" x2="1410" y2="1098"/>
    <line x1="170" y1="1100" x2="1410" y2="1100"/>

    <!-- Тонкая полка в нише -->
    <line x1="170" y1="1235" x2="1410" y2="1235"/>
    <line x1="170" y1="1245" x2="1410" y2="1245"/>

    <!-- Нижняя плоскость ниши -->
    <line x1="160" y1="1375" x2="1420" y2="1375"/>
    <line x1="160" y1="1395" x2="1420" y2="1395"/>

    <!-- Два нижних фасада с технологическими зазорами -->
    <rect x="160" y="1397" width="1260" height="146"/>
    <rect x="160" y="1547" width="1260" height="136"/>

    <!-- Полноразмерный фасад правого модуля -->
    <rect x="1444" y="924" width="474" height="757"/>

    <!-- Утопленный цоколь -->
    <rect x="200" y="1685" width="1680" height="35"/>
  </g>

  <!-- ВИД СЛЕВА. Проекция выровнена по высоте с фасадом. -->
  <text class="label" x="2100" y="875">ВИД СЛЕВА</text>
  <g id="left-view" class="object" aria-label="Вид слева">
    <!-- Боковина: 600 x 765 над цоколем -->
    <rect x="2100" y="920" width="600" height="765"/>

    <!-- Верхняя кромка глубиной 20 мм -->
    <line x1="2100" y1="940" x2="2700" y2="940"/>

    <!-- Утопленный цоколь: отступ 50 мм спереди и 40 мм сзади -->
    <rect x="2150" y="1685" width="510" height="35"/>
  </g>
</svg>
