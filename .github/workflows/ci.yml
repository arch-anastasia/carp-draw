name: CI

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'laravel-rewrite'
  pull_request:
    branches: [main]
  workflow_call:

# Runs on the self-hosted Hetzner runner `hetzner-ci-carpdraw` (label
# `carpdraw`), on the same box as HairstyleAtlas's runner. GitHub-hosted
# runners are blocked account-wide by a billing issue, so jobs on
# ubuntu-latest never started.
#
# A newer commit on the same ref cancels the run testing the one it replaced,
# so an abandoned run does not hold the single runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: [self-hosted, carpdraw]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, gd, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install JS dependencies
        run: npm ci

      # Built first: Blade tests read the Vite manifest.
      - name: Build assets
        run: npm run build

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: TypeScript
        run: npx vue-tsc --noEmit

      - name: ESLint
        run: npx eslint resources/js --quiet

      - name: Vitest
        run: npx vitest run

      - name: PHPUnit
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --compact
        env:
          DRAWING_PROVIDER: fake
          GEMINI_API_KEY: ''
          OPENAI_API_KEY: ''

  larastan:
    runs-on: [self-hosted, carpdraw]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G
